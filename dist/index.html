<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121614">
  <title>REACTOR — 声场反应堆</title>
  <meta name="description" content="让音乐驱动堆芯。基于控制棒阵列的实时音频可视化。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121614'/%3E%3Cpath d='M7 23V15h4v8m3 0V6h4v17m3 0V11h4v12' stroke='%23dded84' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <span class="brand-icon" aria-hidden="true">▦</span> REACTOR
    </a>
    <span class="top-note">声音，进入堆芯。</span>
    <button id="fullscreen" class="plain" type="button">全屏</button>
  </header>

  <main class="layout">
    <section class="stage" id="stage" aria-label="可视化舞台">
      <div class="stage-head">
        <div class="stage-title">
          <h1>声场反应堆</h1>
          <p class="subline" id="mapping"></p>
        </div>
        <div class="live" id="live"><i aria-hidden="true"></i><span id="status">待机 · 演示预览</span></div>
      </div>

      <canvas id="core" tabindex="0"
        aria-label="圆形控制棒阵列三维可视化。方向键旋转视角，加减号缩放，R 键重置视角，空格键播放或暂停。"
        aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown + - R Space"></canvas>

      <div class="stage-legend" aria-label="频段颜色，从中心到边缘">
        <span><i class="swatch" data-band="low"></i>低频</span>
        <span><i class="swatch" data-band="mid"></i>中频</span>
        <span><i class="swatch" data-band="high"></i>高频</span>
        <span class="legend-note">中心 → 边缘</span>
      </div>

      <div class="stage-bottom">
        <p class="hint">
          <span>拖动旋转视角</span>
          <span class="desktop">滚轮缩放</span>
          <span class="touch">双指缩放</span>
          <span class="keys"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 旋转 · <kbd>+</kbd><kbd>−</kbd> 缩放 · <kbd>R</kbd> 重置 · <kbd>空格</kbd> 播放</span>
        </p>
        <button id="reset" class="plain" type="button">重置视角</button>
      </div>

      <div class="drop-hint" aria-hidden="true">
        <strong>松开鼠标，导入音频</strong>
        <small>MP3 / WAV / M4A / FLAC</small>
      </div>
    </section>

    <aside class="console" aria-label="控制台">
      <section class="block source">
        <h2 class="caption">音频输入</h2>
        <div class="source-tabs">
          <button id="demo" class="selected" type="button" aria-pressed="true">演示信号</button>
          <button id="mic" type="button" aria-pressed="false">麦克风</button>
        </div>
        <button id="upload" class="upload" type="button">
          <span class="upload-icon" aria-hidden="true">＋</span>
          <strong>导入音频文件</strong>
          <small>MP3 / WAV / M4A / FLAC · 或拖入舞台</small>
        </button>
        <input id="file" type="file" accept="audio/*" hidden>

        <div class="track">
          <div class="track-text">
            <strong id="trackname">内置演示信号</strong>
            <small id="tracksub">点击播放，启动声场</small>
          </div>
          <button id="play" type="button" aria-label="播放">▶</button>
        </div>

        <div class="timeline">
          <div class="range"><input id="seek" aria-label="播放进度" type="range" min="0" max="100" value="0" step="0.1" disabled></div>
          <div class="timeline-labels"><span id="elapsed">00:00</span><span id="duration">循环演示</span></div>
        </div>
      </section>

      <section class="block response">
        <h2 class="caption">控制棒响应</h2>
        <div class="slider-title"><label for="gain">灵敏度</label><output id="gainval" for="gain">1.4×</output></div>
        <div class="range"><input id="gain" type="range" min="0.3" max="3" value="1.4" step="0.1"></div>
        <div class="slider-title"><label for="relief">起伏高度</label><output id="reliefval" for="relief">100%</output></div>
        <div class="range"><input id="relief" type="range" min="50" max="250" value="100" step="10"></div>
        <div class="slider-title"><label for="smooth">运动平滑度</label><output id="smoothval" for="smooth">75%</output></div>
        <div class="range"><input id="smooth" type="range" min="0" max="95" value="75"></div>
        <div class="slider-title"><label for="volume">播放音量</label><output id="volumeval" for="volume">40%</output></div>
        <div class="range"><input id="volume" type="range" min="0" max="100" value="40"></div>
      </section>

      <section class="block readings">
        <h2 class="caption">实时读数</h2>
        <div class="meters">
          <div><span class="meter-head">输入电平</span><strong><span id="level">—</span><small>dB</small></strong></div>
          <div>
            <span class="meter-head">峰值频率<span class="band-tag" id="peakband" hidden><i class="swatch" id="peakdot" data-band="low"></i><span id="peaklabel"></span></span></span>
            <strong><span id="freq">—</span><small>Hz</small></strong>
          </div>
        </div>
        <canvas id="spectrum" aria-label="实时频谱"></canvas>
      </section>

      <div class="notes">
        <p id="message" role="status">音频仅在本机处理，不会上传。</p>
        <p>音乐驱动 · 非真实反应堆模拟</p>
      </div>
    </aside>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
